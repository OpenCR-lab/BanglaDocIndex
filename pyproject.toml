[project]
name = "bocr-scrape"
version = "0.1.0"
description = "Pipeline that built BanglaDocIndex, an index of 19.9M Bangla document pages"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Nafis Ashraf" }]
dependencies = [
  "boto3>=1.43.118",
  "duckdb>=1.1",
  "google-cloud-storage>=3.1,<4",
  "internetarchive>=5.5,<6",
  "numpy>=1.26",
  "pillow>=10.4",
  "pyarrow>=17",
  "pypdfium2>=4.30,<5",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
  "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/OpenCR-lab/BanglaDocIndex"
Dataset = "https://huggingface.co/datasets/OpenCR-lab/BanglaDocIndex"

[project.scripts]
bocr-scrape = "bocr_scrape.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bocr_scrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test needs internet access (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
